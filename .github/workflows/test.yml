# Arksus CI: engine tests (pytest), web tests (vitest) and the web + map builds on every push and PR.
# AGENTS.md: "Testler geçmeden merge yok. main her zaman build alır."
name: test

on:
  push:
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Install engine
        run: pip install -e "engine[dev]"
      - name: pytest
        working-directory: engine
        run: python -m pytest -q -p no:warnings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: vitest
        working-directory: web
        run: npm test -- --run
      - name: Build (typecheck + vite)
        working-directory: web
        run: npm run build

  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: map/package-lock.json
      - name: Install
        working-directory: map
        run: npm ci
      - name: Build (typecheck + vite)
        working-directory: map
        run: npm run build
