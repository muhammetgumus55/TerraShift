[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nobetsu"
version = "0.0.1"
description = "Arksus engine: FAO-56 soil water balance for fallow vs legume rotations (NASA Space Apps 2026)"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "jsonschema>=4.20"]

[tool.setuptools.packages.find]
include = ["nobetsu*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
